# Uso local: `docker compose up -d --build` funciona sin .env (los valores por
# defecto de abajo son SOLO para prueba local; en un entorno real defínelos en .env).
services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: aquicanta_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aquicantabolivia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aquicantabolivia}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aquicanta_network

  # 2. Interfaz visual para PostgreSQL (Adminer)
  adminer:
    image: adminer:latest
    container_name: aquicanta_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - aquicanta_network

  # 3. Backend API (NestJS)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aquicanta_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aquicantabolivia}?schema=public
      JWT_SECRET: ${JWT_SECRET:-secreto-solo-para-prueba-local-cambiar-en-produccion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aquicantabolivia.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AquiCanta2026!}
      VISITOR_JWT_SECRET: ${VISITOR_JWT_SECRET:-otro-secreto-solo-para-prueba-local-distinto-del-admin}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aquicanta_network

  # 4. Frontend Web (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: aquicanta_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    networks:
      - aquicanta_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  aquicanta_network:
    driver: bridge
